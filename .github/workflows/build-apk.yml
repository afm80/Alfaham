name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # يلقى مجلد مشروع Flutter تلقائياً (الجذر أو أي مجلد فرعي مثل app/)
      - name: Find Flutter project
        id: proj
        run: |
          f=$(find . -name pubspec.yaml -not -path '*/.*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ]; then echo "pubspec.yaml not found"; exit 1; fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Flutter project: $d"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Setup (android/ios + icons)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: bash setup.sh

      - name: Build release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --release

      - name: Sign APK with my key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing in this repository (add the 4 ANDROID_* secrets)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my.jks"
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner sign \
            --ks "$RUNNER_TEMP/my.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            build/app/outputs/flutter-apk/app-release.apk
          $BT/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          rm -f "$RUNNER_TEMP/my.jks"
          echo "تم تفعيل التوقيع بمفتاحك."

      - uses: actions/upload-artifact@v4
        with:
          name: alfaham-admin-apk
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
