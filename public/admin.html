<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - Alfaham Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1f2a;--card:#252b3b;--card2:#2d3447;--accent:#e4e4e7;--text:#fafafa;--muted:#aab2c5;--border:#3b4258;--danger:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:radial-gradient(ellipse at top,#2c3347 0,#222839 45%,#1b1f2a 100%) fixed;color:var(--text);padding:20px;min-height:100vh}
.container{max-width:800px;margin:0 auto}
header{text-align:center;margin-bottom:30px;border-bottom:1px solid var(--border);padding-bottom:15px}
h1{color:#f4f4f5;font-size:24px}
.card-box{background:linear-gradient(160deg,var(--card2),var(--card));border-radius:14px;padding:20px;border:1px solid var(--border);margin-bottom:25px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
input[type=text],textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#1b1f2a;color:#fff;font-size:14px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
textarea{height:180px;font-family:monospace;direction:ltr;text-align:left;resize:vertical}
.upload{display:flex;align-items:center;gap:14px}
.preview{width:90px;height:90px;border-radius:10px;border:1px dashed #4a526a;background:#1b1f2a;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;flex:none}
.preview img{width:100%;height:100%;object-fit:contain}
.pick{background:#3b4258;color:#fff;border:1px solid #4a526a;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
.pick:hover{border-color:var(--accent)}
#cardFile{display:none}
button.main{background:var(--accent);color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer;width:100%;font-size:16px;transition:.2s}
button.main:hover{background:#fff}
button.main:disabled{opacity:.5;cursor:wait}
.items-title{margin-bottom:15px;font-size:18px;color:#d4d4d8}
.item-card{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid var(--border)}
.item-info{display:flex;align-items:center;gap:12px;min-width:0}
.item-img{width:56px;height:56px;border-radius:8px;object-fit:contain;background:#1b1f2a;border:1px solid var(--border);flex:none}
.item-info strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.delete-btn{background:var(--danger);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;flex:none}
.delete-btn:hover{background:#b91c1c}
.btns{display:flex;gap:8px;flex:none}
.edit-btn{background:#3b4258;color:#fff;border:1px solid #4a526a;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.edit-btn:hover{border-color:var(--accent)}
.cancel-btn{display:none;margin-top:10px;background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px;border-radius:10px;width:100%;cursor:pointer;font-size:14px}
.item-card.editing{border-color:var(--accent)}

#login{position:fixed;inset:0;z-index:20000;background:radial-gradient(ellipse at top,#2c3347 0,#222839 45%,#1b1f2a 100%);display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:340px;background:linear-gradient(160deg,#2d3447,var(--card));border:1px solid #3b4258;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#login h2{text-align:center;margin-bottom:18px;font-size:20px;color:#f4f4f5}
#login input{width:100%;padding:12px;margin-bottom:12px;border-radius:10px;border:1px solid #3b4258;background:#1b1f2a;color:#fff;font-size:14px;outline:none;direction:ltr;text-align:left}
#login input:focus{border-color:#e4e4e7}
#login button{width:100%;padding:12px;border:none;border-radius:10px;background:#e4e4e7;color:#000;font-weight:700;font-size:15px;cursor:pointer}
#login button:disabled{opacity:.5}
#login .err{color:#f87171;font-size:13px;min-height:18px;margin-bottom:8px;text-align:center}
.logout{background:#3b4258;color:#fff;border:1px solid #4a526a;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;margin-top:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
<div id="login" style="display:none">
  <div class="box">
    <h2>تسجيل الدخول</h2>
    <input id="lEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
    <input id="lPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <div class="err" id="lErr"></div>
    <button id="lBtn">دخول</button>
  </div>
</div>
<div class="container">
  <header>
    <h1>لوحة التحكم - Alfaham Admin</h1>
    <p style="color:var(--muted);font-size:13px">إدارة الأقسام والكروت والأكواد</p>
    <button class="logout" id="outBtn">تسجيل الخروج</button>
  </header>

  <div class="card-box">
    <h2 id="formTitle" style="font-size:16px;margin-bottom:15px">إضافة قسم / كرت جديد</h2>
    <div class="form-group">
      <label>اسم الكرت / القسم</label>
      <input type="text" id="cardTitle" placeholder="مثال: تطبيق حاسبة أو قسم الألعاب">
    </div>
    <div class="form-group">
      <label>صورة القسم</label>
      <div class="upload">
        <div class="preview" id="preview">بدون صورة</div>
        <div>
          <label class="pick" for="cardFile">اختيار صورة من الجهاز</label>
          <input type="file" id="cardFile" accept="image/*">
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>محرر كود HTML</label>
      <textarea id="cardCode" placeholder="أدخل كود HTML و CSS و JavaScript هنا..."></textarea>
    </div>
    <button class="main" id="saveBtn" onclick="saveCard()">حفظ وإضافة الكرت</button>
    <button class="cancel-btn" id="cancelBtn" onclick="resetForm()">إلغاء التعديل</button>
  </div>

  <div class="items-title">الكروت المضافة حالياً</div>
  <div id="cardsList"></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDjHeOHBU-Ttrq5zsdigfPUg3b-NGzkQIU",
  authDomain:"adminafm.firebaseapp.com",
  databaseURL:"https://adminafm-default-rtdb.firebaseio.com/",
  projectId:"adminafm",
  storageBucket:"adminafm.firebasestorage.app",
  messagingSenderId:"336808346535",
  appId:"1:336808346535:web:f9fd7b95aad568f1c42c82"
});
const db=firebase.database().ref("cards");
const $=id=>document.getElementById(id);
const PH="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#2d3447"/><text x="100" y="108" font-size="22" font-family="sans-serif" fill="#8b93a8" text-anchor="middle">Alfaham</text></svg>');
let imageData="",editingKey=null,allCards={};

/* تصغير الصورة وتحويلها لنص يُحفظ في قاعدة البيانات (بدون الحاجة لـ Storage) */
$("cardFile").addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=600,r=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const png=f.type==="image/png"||f.type==="image/webp"||f.type==="image/gif";
      imageData=png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.85);
      if(imageData.length>400000)imageData=c.toDataURL("image/webp",.8);
      $("preview").innerHTML="";
      const p=document.createElement("img");p.src=imageData;$("preview").appendChild(p);
    };
    img.onerror=()=>alert("تعذّر قراءة الصورة");
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
});

function resetForm(){
  editingKey=null;imageData="";
  $("cardTitle").value="";$("cardCode").value="";$("cardFile").value="";
  $("preview").textContent="بدون صورة";
  $("formTitle").textContent="إضافة قسم / كرت جديد";
  $("saveBtn").textContent="حفظ وإضافة الكرت";
  $("cancelBtn").style.display="none";
  document.querySelectorAll(".item-card.editing").forEach(e=>e.classList.remove("editing"));
}

function startEdit(key){
  const item=allCards[key];if(!item)return;
  editingKey=key;imageData=""; /* تبقى الصورة القديمة إلا إذا اخترت صورة جديدة */
  $("cardTitle").value=item.title||"";
  $("cardCode").value=item.code||"";
  $("cardFile").value="";
  $("preview").innerHTML="";
  const p=document.createElement("img");p.src=item.image||PH;$("preview").appendChild(p);
  $("formTitle").textContent="تعديل الكرت";
  $("saveBtn").textContent="حفظ التعديلات";
  $("cancelBtn").style.display="block";
  document.querySelectorAll(".item-card").forEach(e=>e.classList.toggle("editing",e.dataset.key===key));
  window.scrollTo({top:0,behavior:"smooth"});
}

function saveCard(){
  const title=$("cardTitle").value.trim();
  const code=$("cardCode").value.trim();
  if(!title||!code){alert("يرجى كتابة العنوان وكود HTML على الأقل!");return}
  const btn=$("saveBtn");btn.disabled=true;
  if(editingKey){
    const old=allCards[editingKey]||{};
    db.child(editingKey).update({title:title,code:code,image:imageData||old.image||PH})
    .then(()=>{alert("تم حفظ التعديلات!");resetForm()})
    .catch(err=>alert("حدث خطأ: "+err.message))
    .finally(()=>btn.disabled=false);
    return;
  }
  db.push({title:title,image:imageData||PH,code:code,timestamp:Date.now()})
  .then(()=>{alert("تمت إضافة الكرت بنجاح!");resetForm()})
  .catch(err=>alert("حدث خطأ: "+err.message))
  .finally(()=>btn.disabled=false);
}

function startList(){
db.on("value",snap=>{
  const list=$("cardsList");list.innerHTML="";
  const data=snap.val();allCards=data||{};
  if(!data){list.innerHTML='<p style="color:var(--muted);text-align:center">لا توجد كروت مضافة بعد.</p>';return}
  Object.keys(data).sort((a,b)=>(data[b].timestamp||0)-(data[a].timestamp||0)).forEach(key=>{
    const item=data[key];
    const row=document.createElement("div");row.className="item-card"+(key===editingKey?" editing":"");row.dataset.key=key;
    const info=document.createElement("div");info.className="item-info";
    const im=document.createElement("img");im.className="item-img";im.src=item.image||PH;
    im.onerror=()=>{im.onerror=null;im.src=PH};
    const nm=document.createElement("strong");nm.textContent=item.title||"";
    info.append(im,nm);
    const del=document.createElement("button");del.className="delete-btn";del.textContent="حذف";
    del.onclick=()=>{if(confirm("هل أنت متأكد من حذف هذا الكرت؟")){if(editingKey===key)resetForm();db.child(key).remove()}};
    const ed=document.createElement("button");ed.className="edit-btn";ed.textContent="تعديل";
    ed.onclick=()=>startEdit(key);
    const bt=document.createElement("div");bt.className="btns";bt.append(ed,del);
    row.append(info,bt);list.appendChild(row);
  });
},err=>alert("تعذّر تحميل البيانات: "+err.message));
}

const auth=firebase.auth();
function loginErr(e){
  const m={"auth/wrong-password":"كلمة المرور غير صحيحة","auth/invalid-login-credentials":"البريد أو كلمة المرور غير صحيحة","auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة","auth/user-not-found":"المستخدم غير موجود","auth/invalid-email":"صيغة البريد غير صحيحة","auth/too-many-requests":"محاولات كثيرة، انتظر قليلاً","auth/network-request-failed":"تحقق من الاتصال بالإنترنت"};
  return m[e.code]||("خطأ: "+e.message);
}
function doLogin(){
  const b=document.getElementById("lBtn"),er=document.getElementById("lErr");
  er.textContent="";b.disabled=true;
  auth.signInWithEmailAndPassword(document.getElementById("lEmail").value.trim(),document.getElementById("lPass").value)
   .catch(e=>{er.textContent=loginErr(e)}).then(()=>{b.disabled=false});
}
document.getElementById("lBtn").onclick=doLogin;
document.getElementById("lPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
auth.onAuthStateChanged(u=>{
  if(u){$("login").style.display="none";startList()}
  else{db.off();$("cardsList").innerHTML="";resetForm();$("login").style.display="flex"}
});
$("outBtn").onclick=()=>auth.signOut();
</script>
</body>
</html>
