<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfaham</title>
<style>html,body{height:100%;margin:0;background:#1b1f2a;color:#a1a1aa;font-family:sans-serif}body{display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<p>جارٍ التحميل...</p>
<script>
/* صفحة نظيفة (بدون أي مكتبة Firebase) تشغّل كود الكرت على نفس نطاق الموقع.
   الكود يُقرأ مرة واحدة فقط؛ وعند التحديث يعود إلى view.html لجلب أحدث نسخة. */
(function(){
  var id=new URLSearchParams(location.search).get("id");
  var key="alfahamCode:"+id,code=null;
  try{code=sessionStorage.getItem(key);if(code!==null)sessionStorage.removeItem(key)}catch(e){}
  if(!code){
    try{if(window.name.indexOf(key+"\n")===0){code=window.name.slice(key.length+1);window.name=""}}catch(e){}
  }
  if(!code){location.replace("view.html?id="+encodeURIComponent(id||""));return}
  document.open();document.write(code);document.close();
})();
</script>
</body>
</html>
