<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alfaham</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1f2a;--card:#252b3b;--card2:#2d3447;--accent:#e4e4e7;--text:#fafafa;--muted:#aab2c5;--border:#3b4258;--danger:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:radial-gradient(ellipse at top,#2c3347 0,#222839 45%,#1b1f2a 100%) fixed;color:var(--text);padding:15px;min-height:100vh}
.top{max-width:1200px;margin:0 auto 15px;display:flex;gap:10px;align-items:center}
.top input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:#fff;font-size:14px;outline:none}
.top input:focus{border-color:var(--accent)}
.icon-btn{background:var(--card);border:1px solid var(--border);color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px}
.icon-btn:hover{border-color:var(--accent)}
.chips{max-width:1200px;margin:0 auto 15px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.chip:hover{border-color:#6b7490;color:#fff}.chip.on:hover{color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;max-width:1200px;margin:0 auto}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border-radius:16px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.card:hover{border-color:#6b7490;transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.06)}.card:active{transform:scale(.97)}
.card .im{width:100%;aspect-ratio:1/1;background:#1b1f2a;display:block;position:relative}
.card img{width:100%;height:100%;object-fit:contain;background:#1b1f2a;display:block}
.card .t{padding:11px 10px;font-size:14px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(27,31,42,.45);border-top:1px solid #353c50;color:#f4f4f5}
.pin{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:1px solid #3b4258;border-radius:8px;padding:1px 6px;font-size:12px;backdrop-filter:blur(4px)}
.msg{grid-column:1/-1;text-align:center;color:var(--muted);margin-top:50px}
/* المتصفح الداخلي */
.browser{display:none;position:fixed;inset:0;background:#fff;z-index:9999;flex-direction:column}
.bar{background:var(--card);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center}
.bar .title{flex:1;font-size:14px;font-weight:700;color:#e4e4e7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:#3b4258;color:#fff;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.bar .close{background:var(--danger)}
.browser iframe{flex:1;width:100%;border:none;background:#fff;opacity:0;transition:opacity .25s}
.browser iframe.ready{opacity:1}
.browser{transform:translateY(12px);opacity:0;transition:opacity .22s,transform .22s}
.browser.show{transform:none;opacity:1}
.spin{position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border:4px solid #cbd5e1;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;pointer-events:none}
.spin.off{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.card img{opacity:0;transition:opacity .3s,transform .4s}.card img.ok{opacity:1}.card:hover img{transform:scale(1.03)}
.sk{aspect-ratio:1/1.18;border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,#353c50 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.browser,.browser iframe,.card img{transition:none}.sk{animation:none}}
/* الإعدادات */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10000;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:340px}
.modal h3{margin-bottom:14px;font-size:16px}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px}
.opt input{accent-color:var(--accent)}

#login{position:fixed;inset:0;z-index:20000;background:radial-gradient(ellipse at top,#2c3347 0,#222839 45%,#1b1f2a 100%);display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:340px;background:linear-gradient(160deg,#2d3447,var(--card));border:1px solid #3b4258;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#login h2{text-align:center;margin-bottom:18px;font-size:20px;color:#f4f4f5}
#login input{width:100%;padding:12px;margin-bottom:12px;border-radius:10px;border:1px solid #3b4258;background:#1b1f2a;color:#fff;font-size:14px;outline:none;direction:ltr;text-align:left}
#login input:focus{border-color:#e4e4e7}
#login button{width:100%;padding:12px;border:none;border-radius:10px;background:#e4e4e7;color:#000;font-weight:700;font-size:15px;cursor:pointer}
#login button:disabled{opacity:.5}
#login .err{color:#f87171;font-size:13px;min-height:18px;margin-bottom:8px;text-align:center}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
<div id="login" style="display:none">
  <div class="box">
    <h2>تسجيل الدخول</h2>
    <input id="lEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
    <input id="lPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <div class="err" id="lErr"></div>
    <button id="lBtn">دخول</button>
  </div>
</div>
<div class="top">
  <input id="q" type="search" placeholder="ابحث في الأقسام...">
  <button class="icon-btn" id="setBtn" aria-label="الإعدادات">⚙️</button>
  <button class="icon-btn" id="outBtn">خروج</button>
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>

<div class="browser" id="browser">
  <div class="bar">
    <span class="title" id="bTitle"></span>
    <button id="bReload">↻ تحديث</button>
    <button id="bTab">فتح بتبويب</button>
    <button id="bFull" aria-label="ملء الشاشة">⛶</button>
    <button class="close" id="bClose">إغلاق ✕</button>
  </div>
  <div class="spin" id="spin"></div>
  <iframe id="frame" src="about:blank" allow="clipboard-write; fullscreen"></iframe>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3>طريقة فتح الكرت</h3>
    <label class="opt"><input type="radio" name="mode" value="inapp"> داخل الواجهة (شاشة كاملة)</label>
    <label class="opt"><input type="radio" name="mode" value="tab"> تبويب جديد في المتصفح</label>
    <button class="icon-btn" style="width:100%;margin-top:6px" id="mClose">تم</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDjHeOHBU-Ttrq5zsdigfPUg3b-NGzkQIU",
  authDomain:"adminafm.firebaseapp.com",
  databaseURL:"https://adminafm-default-rtdb.firebaseio.com/",
  projectId:"adminafm",
  storageBucket:"adminafm.firebasestorage.app",
  messagingSenderId:"336808346535",
  appId:"1:336808346535:web:f9fd7b95aad568f1c42c82"
});
const ref=firebase.database().ref("cards");
const CK="alfahamCardsV1";
const urlCache={};
const $=id=>document.getElementById(id);
const FALLBACK="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="130"><rect width="200" height="130" fill="#2d3447"/><text x="100" y="72" font-size="20" font-family="sans-serif" fill="#8b93a8" text-anchor="middle">Alfaham</text></svg>');
let cards=[],cat="الكل",term="",lastId=null;

const getMode=()=>{try{return localStorage.getItem("openModeV2")||"inapp"}catch(e){return"inapp"}};
const setMode=m=>{try{localStorage.setItem("openModeV2",m)}catch(e){}};

function loadCache(){try{const d=JSON.parse(localStorage.getItem(CK)||"null");if(d)return build(d)}catch(e){}return false}
function build(d){
  cards=Object.keys(d).map(k=>({id:k,...d[k]}))
    .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.timestamp||0)-(a.timestamp||0));
  render();return true;
}
let started=false;
function start(){
  if(started)return;started=true;
  loadCache(); // عرض فوري من آخر نسخة محفوظة
  ref.on("value",s=>{
    const d=s.val()||{};
    try{localStorage.setItem(CK,JSON.stringify(d))}catch(e){}
    build(d);
  },err=>{if(!cards.length)$("grid").innerHTML='<p class="msg">تعذّر تحميل البيانات: '+err.message+'</p>'});
}
function stop(){
  started=false;ref.off();cards=[];
  try{localStorage.removeItem(CK)}catch(e){}
  $("grid").innerHTML="";$("chips").innerHTML="";
}

const auth=firebase.auth();
function loginErr(e){
  const m={"auth/wrong-password":"كلمة المرور غير صحيحة","auth/invalid-login-credentials":"البريد أو كلمة المرور غير صحيحة","auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة","auth/user-not-found":"المستخدم غير موجود","auth/invalid-email":"صيغة البريد غير صحيحة","auth/too-many-requests":"محاولات كثيرة، انتظر قليلاً","auth/network-request-failed":"تحقق من الاتصال بالإنترنت"};
  return m[e.code]||("خطأ: "+e.message);
}
function doLogin(){
  const b=document.getElementById("lBtn"),er=document.getElementById("lErr");
  er.textContent="";b.disabled=true;
  auth.signInWithEmailAndPassword(document.getElementById("lEmail").value.trim(),document.getElementById("lPass").value)
   .catch(e=>{er.textContent=loginErr(e)}).then(()=>{b.disabled=false});
}
document.getElementById("lBtn").onclick=doLogin;
document.getElementById("lPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
auth.onAuthStateChanged(u=>{
  if(u){$("login").style.display="none";start()}
  else{stop();$("login").style.display="flex"}
});
$("outBtn").onclick=()=>auth.signOut();

function render(){
  const cats=["الكل",...new Set(cards.map(c=>c.category).filter(Boolean))];
  if(!cats.includes(cat))cat="الكل";
  const chips=$("chips");chips.innerHTML="";
  if(cats.length>1)cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="chip"+(c===cat?" on":"");b.textContent=c;
    b.onclick=()=>{cat=c;render()};chips.appendChild(b);
  });
  const grid=$("grid");grid.innerHTML="";
  const list=cards.filter(c=>(cat==="الكل"||c.category===cat)&&(c.title||"").toLowerCase().includes(term));
  if(!list.length){grid.innerHTML='<p class="msg">'+(cards.length?"لا توجد نتائج.":"لا توجد أقسام مضافة بعد.")+'</p>';return}
  list.forEach(c=>{
    const el=document.createElement("div");el.className="card";
    const img=document.createElement("img");img.src=c.image||FALLBACK;img.loading="lazy";img.alt="";
    img.onload=()=>img.classList.add("ok");img.onerror=()=>{img.onerror=null;img.src=FALLBACK};
    const t=document.createElement("div");t.className="t";t.textContent=c.title||"";
    const w=document.createElement("div");w.className="im";w.appendChild(img);
    el.append(w,t);
    if(c.pinned){const p=document.createElement("span");p.className="pin";p.textContent="⭐";el.appendChild(p)}
    el.onclick=()=>openCard(c);el.addEventListener("pointerenter",()=>warm(c));el.addEventListener("touchstart",()=>warm(c),{passive:true});
    grid.appendChild(el);
  });
}
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};

function blobUrl(c){return "view.html?id="+encodeURIComponent(c.id)} /* رابط https حقيقي بدل blob */

/* تجهيز مسبق: يبدأ عند لمس الكرت فيفتح فورًا عند الضغط */
function warm(c){if(getMode()==="tab")blobUrl(c)}

function openCard(c){
  lastId=c.id;
  if(getMode()==="tab"){
    const w=window.open(blobUrl(c),"_blank");
    if(!w)openInApp(c); // إذا حُظرت النافذة المنبثقة
  }else openInApp(c);
}

let viewerOpen=false;
function openInApp(c){
  const br=$("browser"),fr=$("frame");
  $("bTitle").textContent=c.title;
  $("spin").classList.remove("off");fr.classList.remove("ready");
  fr.onload=()=>{$("spin").classList.add("off");fr.classList.add("ready")};
  fr.src=blobUrl(c);
  br.style.display="flex";
  requestAnimationFrame(()=>br.classList.add("show"));
  document.body.style.overflow="hidden";
  if(!viewerOpen){history.pushState({v:1},"");viewerOpen=true} // زر الرجوع يغلق الكرت
}
function closeViewer(fromPop){
  if(!viewerOpen)return;
  viewerOpen=false;
  const br=$("browser");br.classList.remove("show");
  setTimeout(()=>{br.style.display="none";$("frame").src="about:blank";$("frame").classList.remove("ready")},220);
  document.body.style.overflow="";
  if(!fromPop&&history.state&&history.state.v)history.back();
}
window.addEventListener("popstate",()=>closeViewer(true));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer()});

$("bReload").onclick=()=>{const c=cards.find(x=>x.id===lastId);if(!c)return;const fr=$("frame");$("spin").classList.remove("off");fr.classList.remove("ready");fr.src="about:blank";setTimeout(()=>fr.src=blobUrl(c),30)};
$("bTab").onclick=()=>{const c=cards.find(x=>x.id===lastId);if(c)window.open(blobUrl(c),"_blank")};
$("bFull").onclick=()=>{const b=$("browser");if(document.fullscreenElement)document.exitFullscreen();else if(b.requestFullscreen)b.requestFullscreen().catch(()=>{})};
$("bClose").onclick=()=>closeViewer();

$("setBtn").onclick=()=>{
  document.querySelectorAll('input[name=mode]').forEach(r=>r.checked=r.value===getMode());
  $("modal").style.display="flex";
};
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>setMode(r.value));
$("mClose").onclick=()=>$("modal").style.display="none";
</script>
</body>
</html>
