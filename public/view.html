<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfaham</title>
<style>html,body{height:100%;margin:0;background:#000;color:#a1a1aa;font-family:sans-serif}body{display:flex;align-items:center;justify-content:center}</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<p id="m">جارٍ التحميل...</p>
<script>
/* يفتح كود الكرت على رابط https حقيقي (نفس نطاق الموقع) بدل blob/srcdoc حتى يعمل تسجيل الدخول طبيعيًا */
(function(){
  var id=new URLSearchParams(location.search).get("id");
  function show(code){document.open();document.write(code);document.close()}
  function fail(t){document.getElementById("m").textContent=t}
  if(!id){fail("كرت غير معروف");return}
  var done=false;
  function cached(){
    try{var d=JSON.parse(localStorage.getItem("alfahamCardsV1")||"null");return d&&d[id]&&d[id].code?d[id].code:null}catch(e){return null}
  }
  function finish(code){if(done)return;done=true;show(code)}
  firebase.initializeApp({
    apiKey:"AIzaSyDjHeOHBU-Ttrq5zsdigfPUg3b-NGzkQIU",
    authDomain:"adminafm.firebaseapp.com",
    databaseURL:"https://adminafm-default-rtdb.firebaseio.com/",
    projectId:"adminafm",
    storageBucket:"adminafm.firebasestorage.app",
    messagingSenderId:"336808346535",
    appId:"1:336808346535:web:f9fd7b95aad568f1c42c82"
  });
  /* الأولوية للنسخة الحديثة من قاعدة البيانات، والنسخة المحفوظة احتياطاً إذا تأخر الاتصال */
  var timer=setTimeout(function(){var c=cached();if(c)finish(c)},4000);
  firebase.database().ref("cards/"+id).once("value").then(function(s){
    clearTimeout(timer);
    var c=s.val();
    if(c&&c.code)finish(c.code);
    else{var k=cached();if(k)finish(k);else fail("الكرت غير موجود")}
  }).catch(function(e){
    clearTimeout(timer);
    var k=cached();if(k)finish(k);else fail("تعذّر التحميل: "+e.message)
  });
})();
</script>
</body>
</html>
